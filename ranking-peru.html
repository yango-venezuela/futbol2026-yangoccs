<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Perú | Fútbol Yango 2026</title>
<style>
  :root {
    --red:    #FC3F1D;
    --black:  #1A1A1A;
    --yellow: #FFD700;
    --gray:   #F2F2F2;
    --white:  #FFFFFF;
    --muted:  #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #ECECEC; color: var(--black); }

  /* ── HEADER ── */
  .top-bar {
    background: var(--black);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 56px;
  }
  .top-bar .brand {
    font-weight: 900; font-size: 18px; color: var(--white); letter-spacing: 1px;
    text-transform: uppercase;
  }
  .top-bar .brand span { color: var(--red); }
  .top-bar .badge {
    background: var(--red); color: #fff;
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 4px; text-transform: uppercase;
  }
  .refresh-btn {
    background: var(--yellow); color: var(--black);
    border: none; cursor: pointer;
    font-weight: 900; font-size: 12px; letter-spacing: 0.5px;
    padding: 10px 20px; border-radius: 4px; text-transform: uppercase;
    transition: opacity .15s;
  }
  .refresh-btn:hover { opacity: .85; }
  .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── SUBTABS ── */
  .subtabs {
    background: var(--white);
    display: flex;
    border-bottom: 3px solid var(--black);
    padding: 0 24px;
  }
  .subtab {
    padding: 14px 24px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
    text-transform: uppercase; cursor: pointer;
    border-bottom: 4px solid transparent; margin-bottom: -3px;
    color: var(--muted); background: none; border-top: none;
    border-left: none; border-right: none;
    transition: color .15s, border-color .15s;
  }
  .subtab.active { color: var(--black); border-bottom-color: var(--red); }
  .subtab:hover:not(.active) { color: var(--black); }

  /* ── MAIN ── */
  .main { max-width: 960px; margin: 28px auto; padding: 0 16px 60px; }

  /* ── STATS ── */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--white); border: 2px solid var(--black);
    padding: 14px 16px; border-radius: 4px;
    box-shadow: 4px 4px 0 var(--yellow);
  }
  .stat-card .num { font-size: 28px; font-weight: 900; color: var(--red); }
  .stat-card .lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; margin-top: 2px; }

  /* ── SEARCH / EXPORT ── */
  .toolbar {
    display: flex; gap: 10px; margin-bottom: 12px; align-items: center;
  }
  .search-input {
    flex: 1; padding: 10px 14px; border: 2px solid var(--black);
    font-size: 13px; font-weight: 600; border-radius: 4px; outline: none;
  }
  .search-input:focus { border-color: var(--red); }
  .export-btn {
    background: var(--black); color: var(--white);
    border: none; cursor: pointer;
    font-size: 11px; font-weight: 800; letter-spacing: .5px;
    padding: 10px 16px; border-radius: 4px; text-transform: uppercase;
    white-space: nowrap;
  }
  .export-btn:hover { background: #333; }

  /* ── TABLE ── */
  .rank-table { background: var(--white); border: 2px solid var(--black); border-radius: 4px; overflow: hidden; }
  .rank-row { display: grid; grid-template-columns: 60px 1fr 200px 140px 70px 70px; align-items: center; border-bottom: 1px solid #eee; padding: 10px 16px; gap: 8px; }
  .rank-row.header { background: var(--black); color: var(--white); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.gold   { background: #FFFBEA; }
  .rank-row.silver { background: #F7F7F7; }
  .rank-row.bronze { background: #FFF5F0; }
  .pos { font-size: 18px; font-weight: 900; color: var(--red); }
  .rank-row.gold   .pos { color: #C9A800; }
  .rank-row.silver .pos { color: #888; }
  .rank-row.bronze .pos { color: #CD7F32; }
  .pts { font-size: 20px; font-weight: 900; color: var(--red); text-align: center; }
  .name-cell b  { font-size: 14px; font-weight: 800; display: block; }
  .name-cell span { font-size: 10px; color: var(--muted); }
  .email-cell { font-size: 11px; color: var(--muted); word-break: break-all; }
  .camp-cell  { font-size: 12px; font-weight: 700; }
  .view-btn {
    background: var(--black); color: var(--white);
    border: none; cursor: pointer; padding: 5px 10px;
    font-size: 10px; font-weight: 800; border-radius: 3px; letter-spacing: .5px;
  }
  .view-btn:hover { background: var(--red); }
  .empty { padding: 40px; text-align: center; font-weight: 800; text-transform: uppercase; color: var(--muted); font-size: 13px; }
  .loading { padding: 40px; text-align: center; font-size: 13px; color: var(--muted); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--black); color: var(--white);
    padding: 12px 24px; border-radius: 6px; font-size: 13px; font-weight: 700;
    z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #1a7a1a; }
  .toast.error   { background: #b00; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--white); max-width: 520px; width: 95%;
    border: 3px solid var(--black); border-radius: 6px;
    max-height: 80vh; overflow-y: auto; padding: 24px;
    box-shadow: 8px 8px 0 var(--yellow);
  }
  .modal h3 { font-size: 18px; font-weight: 900; text-transform: uppercase; margin-bottom: 16px; }
  .modal .close-btn {
    float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); margin-top: -4px;
  }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label { font-weight: 800; color: var(--muted); text-transform: uppercase; font-size: 11px; }
  .detail-row .value { font-weight: 700; }

  @media (max-width: 640px) {
    .stats-bar { grid-template-columns: repeat(2,1fr); }
    .rank-row  { grid-template-columns: 46px 1fr 80px 56px; }
    .rank-row .email-cell, .rank-row .camp-cell { display: none; }
    .subtab { padding: 12px 14px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="top-bar">
  <div class="brand"><span>Yango</span> Admin <span style="font-size:11px;font-weight:700;color:var(--yellow);margin-left:8px">PERÚ</span></div>
  <div class="badge">Fútbol 2026</div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">↻ ACTUALIZAR</button>
</div>

<!-- SUBTABS -->
<div class="subtabs">
  <button class="subtab active" id="tab-peru"         onclick="switchTab('peru')">🇵🇪 Usuarios Perú</button>
  <button class="subtab"        id="tab-drivers-peru" onclick="switchTab('drivers-peru')">🚗 Drivers Perú</button>
</div>

<!-- MAIN -->
<div class="main">
  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="num" id="st-total">—</div><div class="lbl">Participantes</div></div>
    <div class="stat-card"><div class="num" id="st-con-pts">—</div><div class="lbl">Con puntos</div></div>
    <div class="stat-card"><div class="num" id="st-max">—</div><div class="lbl">Pts máximos</div></div>
    <div class="stat-card"><div class="num" id="st-avg">—</div><div class="lbl">Promedio</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input class="search-input" id="searchInput" placeholder="Buscar por código o nombre..." oninput="renderTable()">
    <button class="export-btn" onclick="exportCSV()">⬇ EXPORTAR CSV</button>
  </div>

  <!-- Table -->
  <div class="rank-table">
    <div class="rank-row header">
      <div>Pos</div><div>Nombre</div><div>Email</div><div>Campeón</div><div style="text-align:center">Pts</div><div></div>
    </div>
    <div id="rankBody"><div class="loading">Cargando ranking...</div></div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <h3 id="modalTitle">Detalle</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const GOOGLE_SHEETS_URL_PERU         = 'https://script.google.com/macros/s/AKfycby0I3GjBWbjDfr_Upe-1VMcF0W9V73mSwx1mLwiI5x4-PFkDfUvbu6Y83AQEKbtC8vW/exec';
const GOOGLE_SHEETS_URL_DRIVERS_PERU = 'https://script.google.com/macros/s/AKfycbydLyca3O19Cc90KHIAX7Sz_1kNHhINi5TULNTmd7QWNgKSKkSDqaB8QBfRUhroT-Ow0A/exec';

let state = {
  peru:         [],
  driversPeru:  [],
  activeTab:    'peru'
};

// ── Load both rankings ──
async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ CARGANDO...';
  document.getElementById('rankBody').innerHTML = '<div class="loading">Cargando ranking...</div>';

  try {
    const [rP, rD] = await Promise.all([
      fetchRanking(GOOGLE_SHEETS_URL_PERU),
      fetchRanking(GOOGLE_SHEETS_URL_DRIVERS_PERU)
    ]);
    state.peru        = rP;
    state.driversPeru = rD;
    renderTable();
    showToast('✓ Ranking actualizado', 'success');
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
    document.getElementById('rankBody').innerHTML = '<div class="empty">Error al cargar — intenta de nuevo</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ ACTUALIZAR';
  }
}

async function fetchRanking(url) {
  const r = await fetch(url + '?action=get_ranking');
  if (!r.ok) throw new Error('No se pudo conectar con el servidor');
  const data = await r.json();
  return (data.ranking || []).sort((a,b) => (b.puntos||0) - (a.puntos||0));
}

// ── Tab switch ──
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.subtab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('searchInput').value = '';
  renderTable();
}

// ── Render ──
function renderTable() {
  const ranking = state.activeTab === 'peru' ? state.peru : state.driversPeru;
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = q
    ? ranking.filter(r => (r.code||'').toLowerCase().includes(q) || (r.nombre||'').toLowerCase().includes(q))
    : ranking;

  // Stats
  const total    = ranking.length;
  const conPts   = ranking.filter(r => (r.puntos||0) > 0).length;
  const maxPts   = ranking[0] ? (ranking[0].puntos||0) : 0;
  const avg      = total > 0 ? Math.round(ranking.reduce((s,r) => s+(r.puntos||0), 0) / total) : 0;
  document.getElementById('st-total').textContent   = total;
  document.getElementById('st-con-pts').textContent = conPts;
  document.getElementById('st-max').textContent     = maxPts;
  document.getElementById('st-avg').textContent     = avg;

  const body = document.getElementById('rankBody');
  if (!filtered.length) {
    body.innerHTML = '<div class="empty">Sin resultados</div>';
    return;
  }
  body.innerHTML = filtered.map((p, idx) => {
    const posClass = idx===0 ? 'gold' : idx===1 ? 'silver' : idx===2 ? 'bronze' : '';
    const firstName = (p.nombre||'Anónimo').split(' ')[0];
    return `<div class="rank-row ${posClass}">
      <div class="pos">${idx+1}°</div>
      <div class="name-cell"><b>${firstName}</b><span>${p.code||''}</span></div>
      <div class="email-cell">${p.email||''}</div>
      <div class="camp-cell">${p.campeon||'—'}</div>
      <div class="pts">${p.puntos||0}</div>
      <div><button class="view-btn" onclick='showDetail(${JSON.stringify(p)})'>VER</button></div>
    </div>`;
  }).join('');
}

// ── Detail modal ──
function showDetail(p) {
  document.getElementById('modalTitle').textContent = (p.nombre||'Anónimo') + ' · ' + (p.code||'');
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-row"><span class="label">Código</span><span class="value">${p.code||'—'}</span></div>
    <div class="detail-row"><span class="label">Nombre</span><span class="value">${p.nombre||'—'}</span></div>
    <div class="detail-row"><span class="label">Teléfono</span><span class="value">${p.telefono||'—'}</span></div>
    <div class="detail-row"><span class="label">Email</span><span class="value">${p.email||'—'}</span></div>
    <div class="detail-row"><span class="label">Campeón</span><span class="value">${p.campeon||'—'}</span></div>
    <div class="detail-row"><span class="label">Goleador</span><span class="value">${p.goleador||'—'}</span></div>
    <div class="detail-row"><span class="label">Puntos</span><span class="value" style="color:var(--red);font-size:20px">${p.puntos||0}</span></div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ── Export CSV ──
function exportCSV() {
  const ranking = state.activeTab === 'peru' ? state.peru : state.driversPeru;
  if (!ranking.length) { showToast('Sin datos para exportar', 'error'); return; }
  const header = 'Pos,Código,Nombre,Teléfono,Email,Campeón,Goleador,Puntos\n';
  const rows = ranking.map((r,i) =>
    [i+1, r.code||'', r.nombre||'', r.telefono||'', r.email||'', r.campeon||'', r.goleador||'', r.puntos||0]
    .map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')
  ).join('\n');
  const blob = new Blob(['﻿'+header+rows], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ranking-peru-' + state.activeTab + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// ── Toast ──
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3000);
}

// ── Init ──
loadAll();
</script>
</body>
</html>
